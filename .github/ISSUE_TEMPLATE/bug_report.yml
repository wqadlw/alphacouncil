name: Bug report
description: Report something that does not work as specified
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report. The more precisely you can
        describe the problem, the faster it can be fixed.

        **Do not report security vulnerabilities here** — see [SECURITY.md](../SECURITY.md).

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: Describe the behaviour the specification says you should get.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      description: Include the exact error message or output. Do not paste API keys.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal, self-contained reproduction.
      placeholder: |
        1. Set ALPHACOUNCIL_... to ...
        2. Run `make run`
        3. POST /api/v1/research with ...
        4. Observe ...
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit SHA or version
      placeholder: e.g. 0.1.0 or a1b2c3d
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. Ubuntu 24.04, Python 3.12.7, Docker 27.1
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: Which layer is affected?
      options:
        - Not sure
        - core (config, logging)
        - models
        - retrieval
        - agents
        - graph
        - api
        - frontend
        - docs / tooling
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I have not included any secrets or credentials
          required: true

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  WORKING_DIR: backend

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install "ruff==0.8.4"
      - name: Ruff lint
        working-directory: ${{ env.WORKING_DIR }}
        run: ruff check --output-format=github .
      - name: Ruff format check
        working-directory: ${{ env.WORKING_DIR }}
        run: ruff format --check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install project
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          pip install -e ".[dev]"
      - name: Run mypy
        working-directory: ${{ env.WORKING_DIR }}
        run: mypy --config-file pyproject.toml src tests

  test:
    name: Test (pytest, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install project
        working-directory: ${{ env.WORKING_DIR }}
        run: pip install -e ".[dev]"
      - name: Run unit tests with coverage
        working-directory: ${{ env.WORKING_DIR }}
        run: pytest tests/unit -m unit --cov --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: matrix.python == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: backend/coverage.xml
          fail_ci_if_error: false

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs-check:
    name: Required files present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify governance files exist
        run: |
          set -euo pipefail
          required=(
            "README.md"
            "LICENSE"
            "CONTRIBUTING.md"
            "SECURITY.md"
            ".ai/constitution.md"
            ".ai/agents/architect.md"
            ".ai/agents/developer.md"
            ".ai/agents/tester.md"
            ".ai/agents/reviewer.md"
          )
          missing=0
          for f in "${required[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "::error file=$f::required file is missing"
              missing=1
            fi
          done
          exit $missing

  ci:
    name: CI gate
    if: always()
    needs: [lint, typecheck, test, secret-scan, docs-check]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          if echo "$results" | grep -q '"result": "failure"'; then
            echo "::error::one or more required jobs failed"
            exit 1
          fi
          echo "All required jobs passed."

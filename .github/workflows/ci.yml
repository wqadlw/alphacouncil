name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  WORKING_DIR: backend

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        # Pinned to the version the project is developed against. It was pinned
        # at 0.8.4 until the first CI run, which exposed a drift that had never
        # been visible: ruff removed UP038 (`isinstance(x, (A, B))` -> `A | B`)
        # in 0.9.0, so the old pin failed a tree the local toolchain accepts.
        # Bump this together with the local ruff, never separately.
        run: pip install "ruff==0.16.9"
      - name: Ruff lint
        working-directory: ${{ env.WORKING_DIR }}
        run: ruff check --output-format=github .
      - name: Ruff format check
        working-directory: ${{ env.WORKING_DIR }}
        run: ruff format --check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install project
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          pip install -e ".[dev]"
      - name: Run mypy
        working-directory: ${{ env.WORKING_DIR }}
        run: mypy --config-file pyproject.toml src tests

  test:
    name: Test (pytest, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install project
        working-directory: ${{ env.WORKING_DIR }}
        run: pip install -e ".[dev]"
      - name: Run unit tests with coverage
        working-directory: ${{ env.WORKING_DIR }}
        run: pytest tests/unit -m unit --cov --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: matrix.python == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: backend/coverage.xml
          fail_ci_if_error: false

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    # This job exists because the frontend had no check at all until it did.
    # Everything else in this file ran against `backend/`, so a green CI on a
    # commit that broke the frontend said nothing about the frontend — the
    # exact shape of "a check that never ran, reported as passing".
    #
    # The step list here must stay in step with the `frontend-*` gates in
    # `backend/scripts/dev.py`, so that `make check` and CI verify the same set.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `npm ci` rather than `npm install`: it installs the lockfile verbatim
      # and fails if package.json and the lockfile disagree, which is the
      # disagreement worth failing on.
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  static-checks:
    name: Static checks (S-01..S-12)
    runs-on: ubuntu-latest
    # Added 2026-09-26, when all twelve rules ran for the first time. Until then
    # this job could not exist honestly: S-07/S-08/S-09 skipped while there was
    # no frontend, and a skipped rule is not a passing rule (T-19). The rules
    # were implemented and enforced by `make check` locally while CI — the thing
    # everyone trusts — knew nothing about them.
    #
    # `--strict` because `python -m checks` alone exits 0 for "it ran"; this
    # needs the other signal, that nothing was found.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install project
        working-directory: ${{ env.WORKING_DIR }}
        run: pip install -e ".[dev]"
      - name: Run static checks
        working-directory: ${{ env.WORKING_DIR }}
        run: python -m checks --strict

  e2e:
    name: E2E (Playwright, built app)
    runs-on: ubuntu-latest
    # Added 2026-09-27 with spec 010: the UI layer of the red-line enforcement
    # (constitution 12.1). The tests run the *built* app and mock the API layer
    # at the network boundary — deterministic, no live market dependency — while
    # the pytest API tests pin the same response shapes from the other side.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npm run test:e2e

  docs-check:
    name: Required files present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify governance files exist
        run: |
          set -euo pipefail
          required=(
            "README.md"
            "LICENSE"
            "CONTRIBUTING.md"
            "SECURITY.md"
            ".ai/constitution.md"
            ".ai/agents/architect.md"
            ".ai/agents/developer.md"
            ".ai/agents/tester.md"
            ".ai/agents/reviewer.md"
          )
          missing=0
          for f in "${required[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "::error file=$f::required file is missing"
              missing=1
            fi
          done
          exit $missing

  ci:
    name: CI gate
    if: always()
    needs: [lint, typecheck, test, secret-scan, frontend, e2e, static-checks, docs-check]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          # `cancelled` and `skipped` fail too, not just `failure`. A required
          # job that never ran has not verified anything, and reporting that as
          # a pass is the failure mode this gate exists to prevent — the same
          # reason the rest of this repository refuses to render an empty state
          # where a failure belongs.
          if echo "$results" | grep -qE '"result": "(failure|cancelled|skipped)"'; then
            echo "::error::one or more required jobs did not pass"
            exit 1
          fi
          echo "All required jobs passed."

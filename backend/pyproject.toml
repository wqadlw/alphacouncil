[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alphacouncil"
version = "0.1.0"
description = "A practice-oriented knowledge management system for stock market investors"
# ⚠️ These two paths must stay inside `backend/`: hatchling rejects a readme or
# licence outside the project directory ("Readme path must be within the project
# directory"). The previous `../README.md` made `pip install -e .` fail outright
# — it had simply never been run. See .ai/logs/changes/2026-09-26-s1-data-layer.md
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "AlphaCouncil contributors" }]
keywords = ["investment", "knowledge-management", "spaced-repetition", "decision-journal", "sqlite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # config & validation
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # logging
    "structlog>=24.4",
    # http — market data is fetched with the standard library + httpx, no SDKs
    "httpx>=0.27",
    # spaced repetition — the mechanism that makes "never repeat a mistake"
    # a schedule rather than a slogan.
    # ⚠️ The distribution name is `fsrs`, NOT `py-fsrs`: the latter does not
    # exist on PyPI (verified 2026-09-26). 6.3.2 implements FSRS v6.
    "fsrs>=6.0",
    # storage
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
]

# ⚠️ Removed on 2026-09-26, deliberately, with the reason recorded:
#   llama-index-core, qdrant-client  — retrieval stack replaced by SQLite FTS5
#   akshare                          — measured as rate-limited and key-dependent
#   lightrag-hku                     — same retrieval stack
#   pandas                           — not needed; the standard library suffices for OHLCV
# Do not re-add without an ADR. See .ai/memory/decisions.md.

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "httpx2>=2.0",  # required by starlette's TestClient
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[project.urls]
Homepage = "https://github.com/OWNER/alphacouncil"
Issues = "https://github.com/OWNER/alphacouncil/issues"

[project.scripts]
alphacouncil = "alphacouncil.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alphacouncil"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
# `checks` is the static-check package (`.ai/checks/static/`). Listing it here
# keeps isort treating its imports as first-party.
src = ["src", "tests", "checks"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "RUF",  # ruff-specific
    "ASYNC",
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print (no print statements)
    "ANN",  # flake8-annotations (type annotations)
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
]
ignore = [
    "ANN401",  # allow Any in **kwargs of framework integrations
    "S101",    # allow assert in tests (per-file override below)
]

[tool.ruff.lint.per-file-ignores]
# ⭐ `T201` here, and the same boundary in `checks/rules/no_print.py` (S-10) — ⭐ because the
# two rules exist to have **one** scope, which is what S-10's docstring says it wants.
# ⭐ Narrow on purpose: only the file `python -m` runs. ⭐ A module an entry point *calls*
# is ordinary product code and still fails, ⭐ because otherwise 「the output is mine」
# would grow into 「the output is anything on the way out」 — ⭐ and that growth is exactly
# what S-10 exists to prevent. (spec 044)
"src/alphacouncil/notify/__main__.py" = ["T201"]
"tests/**" = [
    "S101",   # assert is the assertion mechanism
    "ANN201",
    "ANN401",
    "ARG001",
    "ARG002",
    "S105",   # a hard-coded "password" in a fixture is the point of the fixture
    "S106",
    "RUF001", # fixtures carry Chinese UI strings on purpose
    "RUF002",
]
# The one module that carries product copy on purpose, and it is a **new
# precedent** (2026-09-28, spec 020) — no other `src/` file holds CJK literals,
# because display wording has always lived in `frontend/`.
#
# `QuadrantJudgement.guidance()` is here rather than in `ReviewPage.tsx` because
# the dangerous quadrant's sentence is **product policy, not presentation**:
# red line 10 forbids 美化 here, and a UI-authored version of that warning is one
# careless PR away from "congratulations, good call!". Putting it next to the
# rule makes the wording reviewable in the same diff as the rule, and gives
# `test_every_quadrant_has_a_line_and_none_mentions_a_number` something to hold.
# Narrow on purpose: `RUF001` stays on everywhere else in `src/`, so a lookalike
# homoglyph in a real identifier is still caught.
"src/alphacouncil/domain/review.py" = ["RUF001", "RUF002"]
# `today.py` for a different and narrower reason (2026-09-28, spec 023): it
# **quotes `项目总纲` §2.1⑤ verbatim** — "一句陈述，无推送、无红点、无催促词" — because
# that exact wording is the thing this module has to stay inside, and paraphrasing
# it into English would lose the constraint it is citing. `RUF002` cannot tell a
# verbatim quotation from a string literal, and **editing a quotation to satisfy a
# linter is worse than the warning**. The file has no other CJK, so the exemption
# buys nothing else.
"src/alphacouncil/api/routes/today.py" = ["RUF001", "RUF002"]
# The notes API (spec 026/028) for the same reason as `today.py`: it quotes
# the product rules it enforces — 「一句陈述，无推送、无红点、无催促词」 and
# 「我的想法还没定」 — because paraphrasing them into English would lose the
# constraint being cited, and `RUF002` cannot tell a quotation from a string.
"src/alphacouncil/api/routes/notes.py" = ["RUF001", "RUF002"]

# The lesson layer (spec 030) for the same reason as `today.py`, and it is the
# clearest case of the four: both files quote **the diagnosis that created notes**
# verbatim — 「`cards` 表被 `source_url` 必填 … 宏观判断、方法论、**教训**、读书笔记全部记不下」 —
# because the module's whole argument is that a lesson is one of the four things
# `cards` could not hold, and a paraphrase would no longer be *that* argument.
# `domain/lesson.py` additionally quotes red line 7 (「每条教训必须生成一条调度项」) and
# the `note_reviews` `reset` reasoning that the **absence** of a third outcome
# depends on — and an absence cannot be paraphrased at all.
# `repositories/lesson.py` quotes red line 7 at both the module and the function
# that implements it, which is the one place a reader will look to check whether
# the guarantee is real.
"src/alphacouncil/domain/lesson.py" = ["RUF001", "RUF002"]
"src/alphacouncil/storage/repositories/lesson.py" = ["RUF001", "RUF002"]

# The lessons API (spec 030) for the same reason as `today.py`, and with the most
# quotations of the six. All three are load-bearing rather than decorative:
#   * `项目总纲` §2.1⑤ - 「你欠 N 条」, in the module docstring's reason for the queue
#     row having no title. ⭐ That sentence *is* the reason; an English paraphrase of it
#     is a different argument, and a weaker one.
#   * red line 7 - 「每条教训必须生成一条调度项」, and the reason a lesson stays on its own
#     queue after being promoted to a card.
#   * the rating copy - 「我不同意我学到的东西了」. The same decision spec 028 made for a
#     note's `again`, and a **product** distinction: calling it 「我忘了」 would be wrong,
#     so the wording is the constraint.
# `E501` and `I001` stay **on** for this file, which is why its prose had to be
# rewrapped to fit 100 columns instead of the file being exempted from the limit.
"src/alphacouncil/api/routes/lessons.py" = ["RUF001", "RUF002"]
# `core/http.py` (spec 039) for the same reason as `today.py`, and with the same
# caveat that makes those exemptions cheap: it **quotes constitution §7.8 verbatim**
# — 「限流**必须是一个函数**，不能是"请大家记得加 sleep"」 — because that sentence is
# the rule this module exists to satisfy, and a paraphrase into English would stop
# being checkable against the constitution by eye. The only CJK in the file is that
# quotation and the 「唯一入口」 table, so the exemption buys nothing else.
"src/alphacouncil/core/http.py" = ["RUF001", "RUF002"]
# `domain/criterion_sentence.py` (spec 044) for a **stronger** version of the reason the
# others give: those files mix code with Chinese UI copy, ⭐ and this one is **almost
# entirely** the copy — a module whose product is five sentences. ⭐ The fullwidth
# punctuation is the sentences' own, so "fixing" it would change what the reader reads.
# ⭐ It also moved here deliberately: spec 040 built these in TypeScript, and the reason a
# notification could not reuse them is that there was no server-side home for them.
"src/alphacouncil/domain/criterion_sentence.py" = ["RUF001", "RUF002"]
# ⭐ `providers/financial.py` (spec 043) deliberately has **no** exemption here, even though
# it is written in mixed CJK/English. The first draft asked for one, on the grounds that
# `ProviderCapabilities.notes` is 「§4.5 的降级说明，会上屏」. ⭐ **That was false** —
# `CapabilitiesRead` carries `CapabilityCell`/`CapabilitySource`, neither of which has a
# `notes` field, so nothing renders it today. A guard switched off on the strength of a claim
# about a feature that does not exist yet is the wrong trade; the file uses ASCII punctuation
# in `notes` instead, and the Chinese stays where it is quoting the constitution.
# The notes layer (spec 026) for the same reason as `today.py`, one step up the
# stack: `domain/note.py` **quotes two specifications verbatim** — the provenance
# rule from `基础功能打磨与AI桥接` §2.1 (「不是笔记。笔记可以没有来源；卡片必须有」) and
# the link semantics from `references/research/02` — because the whole design
# turns on those exact sentences. `RUF002` cannot tell a quotation from a string
# literal, and **rewriting a quotation to satisfy a linter is worse than the
# warning**. `RUF001` is here for the user-facing Chinese error messages, which
# the reader sees; that is the same reason `tests/**` already carries it.
#
# Narrow on purpose, same as the two above: `RUF001`/`RUF002` stay on everywhere
# else in `src/`, so a lookalike homoglyph in a real identifier is still caught.
"src/alphacouncil/domain/note.py" = ["RUF001", "RUF002"]
"src/alphacouncil/storage/repositories/notes.py" = ["RUF001"]
# The note recall queue (spec 028) for the same reason as the note modules
# above: it quotes the spec's own sentences (「我的思想还没定」, the reset
# rationale) because the exact wording is the constraint being cited, and
# `RUF002` cannot tell a quotation from a string literal. The same file's
# sibling `note_recall.py` is exempted for the identical reason; `RUF001` is
# on because the reader-facing refusals are Chinese.
"src/alphacouncil/storage/repositories/note_recall.py" = ["RUF001", "RUF002"]

# `cards.py` (spec 057) holds **`RUF001` alone**, for exactly the reason
# `notes.py` above does rather than the reason `note_recall.py` does. ⭐ The one
# Chinese string it added is the refusal `_generate_card_id` raises when
# 1000 ids are taken in one millisecond — ⭐ a message the reader sees, so
# `RUF001` is on for it. ⭐ `RUF002` is **not** granted: the docstring it grew
# quotes the K1 changelog, and that quote was paraphrased into English
# instead, because it is a *reference* rather than a constraint being cited. ⭐
# So this entry is narrower than its neighbours' on purpose — the English
# paraphrase is the cheaper option here, and the exemption list should not be
# where a module goes to stop being read.
"src/alphacouncil/storage/repositories/cards.py" = ["RUF001"]

# The demo seeder (spec 057) for a **stronger** version of the reason the files
# above give, because this one is *nearly all* copy: `_NOTES`, `_CARDS` and
# `_DECISIONS` are the sentences a reader sees when they run `dev.py demo`, and
# `refuse_to_overwrite`'s refusal is quoted in `dev.py` back to them. ⭐ The
# difference from `criterion_sentence.py` — the nearest precedent — is that
# this module's strings are **not constraints being cited**: they are invented
# demo copy. ⭐ So nothing here is load-bearing at the wording level, and the
# exemption buys only "the linter cannot tell invented Chinese from a homoglyph",
# which is exactly what `RUF001`/`RUF002` cannot do in any file. ⭐ `RUF002` is
# included because the docstrings cite the K1 changelog and spec §六 in Chinese.
#
# Narrow on purpose, same as the others: `RUF001`/`RUF002` stay on everywhere
# else in `src/`, so a lookalike homoglyph in a real identifier is still caught.
# ⭐ Worth noting the cost this list has already begun to pay — `cards.py` had to
# have a docstring **paraphrased into English** to avoid becoming a seventh entry.
# ⭐ A list whose length is the price of writing a Chinese sentence will eventually
# be edited to say "none of these are special", which is why each entry above
# states what would *not* qualify.
"src/alphacouncil/demo.py" = ["RUF001", "RUF002"]
"src/alphacouncil/__main__.py" = ["T201"]  # CLI entry point may print
# Developer tooling: printing is the interface, and the subprocess argv is
# built from constants in this repo, never from user input.
"scripts/**" = ["T201", "S603", "S607"]
# The static-check package is developer tooling too, and its `fix` strings are
# prose shown to a human — Chinese, so the ambiguous-character rules do not
# apply. Its stdout/stderr split is specified in `.ai/error-codes.md` §1.1.
# E402: `checks/__main__.py` imports the shared console helper from `scripts/`,
# which needs an explicit `sys.path` line first (see the comment there).
"checks/**" = ["T201", "RUF001", "RUF002", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["alphacouncil"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
# `scripts/` is on the import path for tests (see `pythonpath` below), so mypy
# has to see it too or every `import check_licenses` becomes an unresolved
# reference. The tools are still *not* in `files` — they are untyped-by-
# configuration, which `.ai/status.md` §五 records as a known gap.
mypy_path = ["scripts"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
warn_unused_ignores = true
disallow_untyped_decorators = true
no_implicit_reexport = true
show_error_codes = true
# `checks/` is included so the rules that guard the product are themselves
# type-checked. A rule module is code, and untested, untyped tooling is how a
# guard silently stops guarding.
files = ["src", "tests", "checks"]

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true
# `baostock` ships no stubs and no `py.typed` (spec 043). ⭐ Narrow on purpose: the flag is
# for the **import** only, so every use of the module stays `Any` and mypy still refuses to
# let one reach a return annotation — ⭐ which is the reason `providers/financial.py` wraps
# the library in typed dataclasses and a checked `_rows()`. A blanket waiver on the module
# would have hidden that boundary instead of describing it.
[[tool.mypy.overrides]]
module = ["baostock.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# `backend/` on sys.path so tests can `import checks` (the static-check package)
# without a `sys.path` hack in every test module. `scripts/` is here for the
# same reason: the developer tools import `_console` exactly as they do when run
# (`python scripts/dev.py` puts `scripts/` on sys.path[0]), so a test can import
# them the same way instead of in a second, different way.
pythonpath = [".", "scripts"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: unit tests, no external dependencies",
    "integration: integration tests, may use containers or mocks",
    "live: hits the real network — never run in CI",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/alphacouncil"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
